    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222222;
        }

        .profile-card {
            /* width: 350px; */
            /* height: 500px; */
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: .4s;
        }

        .profile-card::after {
            content: '';
            width: 120%;
            height: 120%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgb(124, 124, 124);
            /* transform: scale(1.2); */
            border-radius: 10px;
            transition: .4s;
        }

        .profile-card:hover::before {
            opacity: 1;
        }

        .profile-card:hover::after {
            width: calc(100% - 20px);
            height: calc(100% - 20px);
        }

        .profile-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon {
            height: 40px;
            width: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgb(182, 182, 182);
            border-radius: 50%;
            position: absolute;
            transition: .5s;
            z-index: 11;
        }

        .icon:hover {
            background: white;
        }

        .icon:hover .f-icon {
            color: #000000;
        }

        .icon1 {
            transition: 1s;
            top: 125px;
            right: -20%;
        }

        .icon2 {
            transition: .75s;
            top: 75px;
            right: -20%;
        }

        .icon3 {
            transition: .5s;
            top: 25px;
            right: -20%;
        }

        .profile-card:hover .icon {
            right: 20px;
        }

        .f-icon {
            color: rgb(180, 180, 180);
            transition: .5s;
        }

        .trainer-name {
            color: rgb(226, 226, 226);
            position: absolute;
            bottom: 45px;
            left: -100%;
            font-size: 25px;
            font-weight: 600;
            transition: .5s;
        }

        .trainer-profession {
            color: rgb(170, 170, 170);
            position: absolute;
            bottom: 25px;
            left: -100%;
            font-size: 18px;
            transition: .75s;
        }

        .profile-card:hover .trainer-name {
            left: 30px;
        }

        .profile-card:hover .trainer-profession {
            left: 30px;
        }

        .owl-theme .owl-dots .owl-dot span {
            background: rgb(117, 117, 117);
        }

        .owl-carousel .owl-dots .owl-dot.active span,
        .owl-carousel .owl-dots .owl-dot:hover span {
            background-color: rgb(255, 94, 0);
        }
    </style>
