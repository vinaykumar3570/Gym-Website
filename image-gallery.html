<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="fontAwesome/css/all.min.css">
    <link rel="stylesheet" href="bootstrap/Bootstrap.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =================================
   MAIN GALLERY
================================= */

        .gym-gallery {
            width: min(100%, 1116px);
            margin: 0 auto;
            display: grid;

            /*
       3 columns:
       2fr + 2fr = large left section
       1fr      = right section
    */
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;

            /*
       Top = large
       Bottom = small
    */
            grid-template-rows: 1fr 1fr 1fr 1fr 1fr;

            gap: 4px;

            overflow: hidden;
        }


        /* =================================
   ALL IMAGE ITEMS
================================= */

        .gallery-item {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition: transform 0.45s ease;
        }


        /* Optional hover effect */

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .hero {
            grid-column: 1 / 5;
            grid-row: 1/4;
        }

        .training {
            grid-column: 5/7;
            grid-row: 1/3;
        }

        .ropes {
            grid-column: 1/3;
            grid-row: 4/7;
        }

        .weights {
            grid-column: 3/5;
            grid-row: 4/7;
        }

        .cardio {
            grid-column: 5/7;
            grid-row: 3/7;
        }


        /* ================ TABLET ==================== */

        @media (max-width: 991px) {

            .gym-gallery {
                width: 100%;

                grid-template-columns: 1fr 1fr;

                grid-template-rows:
                    430px 260px 330px;

                gap: 4px;
            }


            /* Large image */

            .hero {
                grid-column: 1 / 3;
                grid-row: 1;
            }


            /* Row 2 */

            .training {
                grid-column: 1;
                grid-row: 2;
            }

            .ropes {
                grid-column: 2;
                grid-row: 2;
            }


            /* Row 3 */

            .weights {
                grid-column: 1;
                grid-row: 3;
            }

            .cardio {
                grid-column: 2;
                grid-row: 3;
            }
        }


        /* =============== MOBILE ================ */

        @media (max-width: 575px) {

            .gym-gallery {
                width: 100%;

                display: grid;

                grid-template-columns: 1fr;

                grid-template-rows: auto;

                gap: 3px;
            }


            .gallery-item {
                grid-column: auto;
                grid-row: auto;
            }


            /* Main image */

            .hero {
                height: 330px;
            }


            assests/images/slider1.jpg .training,
            .ropes,
            .weights,
            .cardio {
                height: 260px;
            }
        }


        /* ================ SMALL MOBILE =================== */

        @media (max-width: 380px) {

            .hero {
                height: 280px;
            }

            .training,
            .ropes,
            .weights,
            .cardio {
                height: 220px;
            }
        }
    </style>
</head>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CoreX Gym Gallery</title>

    </head>

    <body>

        <div class="container">
        <div class="gym-gallery">
                <!-- Large Hero Image -->
                <div class="gallery-item hero">
                    <img src="assests/images/19298fa7-d68e-47e8-81cc-3972d40e8f1a.jpg" alt="CoreX gym reception">
                </div>

                <!-- Top Right -->
                <div class="gallery-item training">
                    <img src="assests/images/slider1.jpg" alt="Gym strength training">
                </div>

                <!-- Bottom Left -->
                <div class="gallery-item ropes">
                    <img src="assests/images/slider2.jpg" alt="Battle rope workout">
                </div>

                <!-- Bottom Center -->
                <div class="gallery-item weights">
                    <img src="assests/images/slider3.jpg" alt="Gym weights area">
                </div>

                <!-- Right Column Bottom -->
                <div class="gallery-item cardio">
                    <img src="assests/images/f6113690-909a-4cd3-afef-d480ceeab6fb.jpg" alt="Gym cardio area">
                </div>
            </div>
        </div>

    </body>

    </html>

</body>

</html>
